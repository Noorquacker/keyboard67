import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace = "com.lurebat.keyboard71"
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    // WARNING: the keystore path and plaintext passwords previously committed in this file
    // must be rotated — they remain in git history and are no longer used here.
    signingConfigs {
        debug {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
        release {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }
    defaultConfig {
        compileSdk 33
        applicationId 'com.lurebat.keyboard71'
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 602
        versionName "71.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            testCoverageEnabled = "true"
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            jniDebuggable false
            debuggable false
            renderscriptDebuggable false
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.lurebat.keyboard71'
    lint {
        abortOnError false
    }
    sourceSets {
        main {
            java {
                srcDirs 'src\\main\\java'
            }
        }
    }

    defaultConfig {
        ndk {
            // armeabi-v7a: the original 32-bit libgl2jni.so, run natively.
            // arm64-v8a / x86_64: ninbridge (src/main/cpp), which runs that same library under an
            // ARM32 JIT so the keyboard works on 64-bit-only devices.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1+"
        }
    }

    // NDK r27+ is required (16 KiB page support). Point at a local install with
    // `nin.ndkPath=/path/to/ndk` in local.properties, otherwise the SDK's NDK of this version is used.
    def localProps = new Properties()
    if (rootProject.file("local.properties").exists()) {
        localProps.load(new FileInputStream(rootProject.file("local.properties")))
    }
    if (localProps['nin.ndkPath']) {
        ndkPath localProps['nin.ndkPath']
    } else {
        ndkVersion "27.2.12479018"
    }
}
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += [
                "-Xallow-jvm-ir-dependencies",
                "-P",
                "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
        ]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.7'
    implementation 'org.jetbrains:annotations:24.0.1'
    implementation 'androidx.datastore:datastore-preferences-android:1.1.0-alpha04'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    implementation 'com.github.alorma:compose-settings-ui-m3:0.27.0'
    implementation 'com.github.alorma:compose-settings-storage-datastore:0.27.0'

    implementation platform('androidx.compose:compose-bom:2023.06.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2023.06.01')

    implementation 'androidx.compose.material3:material3'
    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.7.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'


}
